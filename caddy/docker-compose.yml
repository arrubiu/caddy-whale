services:
  caddy:
    build: .
    image: caddy-custom:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
      - CADDY_LOG_LEVEL=INFO
      # Dice a caddy-docker-proxy di usare il Caddyfile base (global options + log)
      # Blocco CrowdSec nel Caddyfile disattivato per ora: vedi README > TODO CrowdSec
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      # - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}  # TODO: decommentare (vedi README > TODO CrowdSec)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - caddy
      # - crowdsec  # TODO: decommentare (vedi README > TODO CrowdSec)

  goaccess:
    image: allinurl/goaccess:1.11
    container_name: goaccess
    restart: unless-stopped
    volumes:
      - caddy_logs:/var/log/caddy:ro
      - goaccess_html:/report
    entrypoint: ["sh", "-c"]
    command: >
      touch /var/log/caddy/caddy.log &&
      exec goaccess /var/log/caddy/caddy.log
      --log-format=CADDY
      --real-time-html
      --output=/report/index.html
      --port=7890
      --ws-url=wss://caddy.ildeposito.org/ws
    labels:
      caddy: caddy.ildeposito.org
      # 0-2. Pulizia degli header per prevenire spoofing
      caddy.route.0_request_header: "-Remote-User"
      caddy.route.1_request_header: "-Remote-Groups"
      caddy.route.2_request_header: "-Remote-Email"
      # 3. Authelia Forward Auth
      caddy.route.3_forward_auth: "authelia:9091"
      caddy.route.3_forward_auth.uri: "/api/authz/forward-auth"
      caddy.route.3_forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Email"
      # 4. Reverse Proxy per il WebSocket
      caddy.route.4_reverse_proxy: "/ws {{upstreams 7890}}"
      # 5-6. Servizio file statici HTML generati da GoAccess
      caddy.route.5_root: "/var/www/html/goaccess"
      caddy.route.6_file_server: ""
    networks:
      - caddy
volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
    external: true
  goaccess_html:

networks:
  caddy:
    external: true
  # crowdsec:               # TODO: decommentare (vedi README > TODO CrowdSec)
  #   external: true
